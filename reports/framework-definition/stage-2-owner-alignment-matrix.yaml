  - "Creating, modifying, or triaging backlog candidates"
  - "Executing any spike"
  - "Promoting any finding to approved rule, gate, or spike status"
  - "Modifying Blueprint content (Blueprint is closed)"
  - "Implementing runtime, agents, commands, scripts, or validators"
  - "Creating new decision entries in project-truth/decisions/"
  - "Committing or pushing any artifact"
  - "Adjusting V1 scope, pilot scope, or readiness criteria"
  - "Simulating owner decisions (RC-01 through RC-06 require actual owner responses)"
  - "Reopening CRIT-01 through CRIT-07"
  - "Reopening TOM"
  - "Creating CRIT-08"

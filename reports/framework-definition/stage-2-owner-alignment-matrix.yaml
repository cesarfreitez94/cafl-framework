scope_change_risks:
  - id: SCR-01
    title: "V1 timeline vs. execution readiness gap"
    description: >
      The 2-month horizon and current theory-to-execution gap may be irreconcilable
      without aggressive prioritization. If roadmap attempts to address all gaps
      sequentially before executing the pilot, timeline collapses.
    trigger: >
      Roadmap reveals that spike execution + mechanism implementation + pilot
      execution cannot fit within 2 months at acceptable quality.
    required_owner_decision: >
      Extend timeline, reduce pilot scope, or accept a V1 that demonstrates
      only design-and-elicitation phases without full execution.
  - id: SCR-02
    title: "Pilot scope adequacy for full readiness criteria"
    description: >
      Even the simple InternalRequest/ApprovalRecord pilot must meet full readiness
      criteria (installable, tests, security, docs, evidence). This may reveal
      the pilot is underscoped or the criteria are over-specified for V1.
    trigger: >
      Pilot cannot demonstrate full readiness criteria within 2 months.
    required_owner_decision: >
      Adjust the scope of what constitutes a 'sufficient' V1 demonstration,
      not the readiness criteria themselves.
  - id: SCR-03
    title: "Knowledge governance blocking real pilot work"
    description: >
      Minimum source policy (docs.odoo.com + github.com/odoo/odoo) may be
      insufficient for the pilot module implementation, creating excessive
      Knowledge Gap blocks.
    trigger: >
      Pilot reveals minimum sources are insufficient for a simple Odoo 18
      module implementation.
    required_owner_decision: >
      Source expansion decision before pilot execution proceeds.
  - id: SCR-04
    title: "Documentation-factory continuation"
    description: >
      If next work cycle after Stage 2 produces additional documentation
      rather than executable artifacts, the documentation-factory pattern
      continues without resolution.
    trigger: >
      Next deliverable after Stage 2 is a new analysis or planning document
      rather than a spike result, a real mechanism, or a pilot artifact.
    required_owner_decision: >
      Owner confirmation that additional documentation is acceptable,
      or explicit instruction to pivot to execution.

non_authorizations:

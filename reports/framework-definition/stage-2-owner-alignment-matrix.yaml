      severity: critical
      classification: SCOPE_CHANGE_RISK
      alignment_threat: OE-08
      description: >
        Documentation factory risk directly threatens V1 operational delivery.
        If the framework remains documentation-only, V1 fails owner expectation
        regardless of internal coherence. Requires owner decision on ratio.
    - id: FND-POSTBP-09
      severity: critical
      classification: GATE
      alignment_threat: "OE-06, OE-11"
      description: >
        No gate enforces source authorization at implementation time.
        Knowledge governance is policy-declared but structurally unenforced.
    - id: FND-POSTBP-11
      severity: critical
      classification: SCOPE_CHANGE_RISK
      alignment_threat: All OE items (meta risk)
      description: >
        Blueprint internal coherence does not guarantee owner-intent alignment.
        Stage 2 directly addresses this finding. Partially resolved by this review;
        not fully resolved until owner confirms Stage 2 verdict.
    - id: FND-POSTBP-14
      severity: critical
      classification: GATE
      alignment_threat: OE-09 (evidence package integrity)
      description: >
        Generated artifacts can contaminate commits and degrade audit trail.
        Does not affect design alignment direction but threatens evidence
        package integrity required by OE-09.
  high_impact:
    - id: FND-POSTBP-01
      severity: high
      classification: RULE
      alignment_threat: OE-07
      description: >
        Context routing enforcement absent. Structural mechanism for token
        optimization does not exist. OE-07 is aspirational without this.
    - id: FND-POSTBP-03
      severity: high
      classification: RULE
      alignment_threat: OE-07
      description: >
        Verification re-reads full context. Contradicts aggressive token
        optimization requirement. Incremental verification not defined.
    - id: FND-POSTBP-05
      severity: high
      classification: RULE
      alignment_threat: OE-04
      description: >
        Agents help instead of blocking on incomplete contracts. Violates
        the 'must block and ask' owner requirement structurally.
    - id: FND-POSTBP-07
      severity: high
      classification: BACKLOG_IMPACT
      alignment_threat: OE-08
      description: >
        Backlog candidates cannot generate work packages. Framework cannot
        self-organize V1 execution without this bridge.
    - id: FND-POSTBP-12
      severity: high
      classification: RULE
      alignment_threat: OE-03
      description: >
        Owner/ChatGPT as external coordinator contradicts team-equivalent
        autonomy claim. Self-coordination model is undefined.
    - id: FND-POSTBP-13
      severity: high
      classification: BACKLOG_IMPACT
      alignment_threat: OE-08
      description: >
        Capability-to-work-package execution bridge does not exist.
        V1 cannot execute without this bridge.
  medium_impact:
    - id: FND-POSTBP-04
      severity: medium
      classification: RULE
      alignment_threat: OE-04
      description: >
        Missing task-type context packet templates makes missing-info detection
        unreliable. Indirect threat to blocking-on-assumption principle.
    - id: FND-POSTBP-08
      severity: medium
      classification: ROADMAP_IMPACT
      alignment_threat: OE-08 (sequencing)
      description: >
        Spikes not integrated into execution flow. Conditional capabilities
        cannot be activated. Roadmap sequencing is blocked.
    - id: FND-POSTBP-02
      severity: high
      classification: RULE
      alignment_threat: OE-03 (autonomy)
      description: >
        Multi-step flows lack structured orchestration contracts.
        Long flows remain fragile and owner-dependent.
    - id: FND-POSTBP-10
      severity: medium
      classification: RULE
      alignment_threat: Internal governance consistency
      description: >
        Lack of formal taxonomy creates governance ambiguity. Does not
        directly threaten owner alignment direction but creates ambiguity
        in how findings are acted upon.
    - id: FND-POSTBP-15
      severity: high
      classification: RULE
      alignment_threat: "OE-07, gate integrity"
      description: >
        No model-class policy. Cheap models could be used for critical
        judgment tasks, undermining gate separation principle.


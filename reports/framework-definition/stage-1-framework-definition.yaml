# CAFL V1 Framework Definition — Stage 1 Extraction
# Generated: 2026-05-31
# Status: proposed
# Authority: derived, non-authoritative until approved
# Scope: current framework definition extracted from repo evidence only
# Non-goals: no alignment verdict, no roadmap, no backlog triage, no spike plan,
#   no work packages, no findings promotion, no implementation authorization

metadata:
  stage: 1
  title: "Current Framework Definition Extraction"
  status: proposed
  source_of_truth: project-truth/
  authority_order:
    1: project-truth/decisions/accepted.md
    2: project-truth/TOM.md
    3: project-truth/decisions/rejected.md
    4: project-truth/decisions/superseded.md
    5: project-truth/critical-map.md
    6: project-truth/decisions/pending.md
    7: project-truth/risks.md
  supporting_sources:
    - project-truth/glossary.md
    - project-truth/implementation-blueprint.md
    - project-truth/blueprint-state.yaml
    - project-truth/blueprint-contract.yaml
    - reports/blueprint/deterministic-verification-report.md
    - reports/backlog/backlog-generation-report.md
    - reports/backlog/backlog-verification-report.md
    - backlog/backlog-candidates.yaml
    - backlog/backlog-traceability.yaml
    - backlog/backlog-contract.yaml
    - generated/blueprint/blueprint-index.json
  context_only_sources:
    - reports/findings/post-blueprint-findings-register.md
    - reports/findings/post-blueprint-findings-executive-summary.md
  excluded_as_authority:
    - framework/         # discarded as contaminated input (CRIT-07, DEC-ACCEPTED-133)
    - root README.md     # status mirror only; project-truth/ wins on conflict
    - .opencode/         # Blueprint automation governance only, not final CAFL agents/commands
    - docs/coordination/  # coordination reference only, not source of truth

framework:
  definition: >
    CAFL es un framework/plataforma operativo sobre OpenCode para desarrollar
    soluciones empresariales Odoo con asistencia de IA durante el ciclo de vida
    de desarrollo.
  source: DEC-ACCEPTED-013
  classification: >
    Framework operativo especializado en Odoo. No es un framework generico
    multi-stack ni una plataforma general para desarrollo en cualquier
    tecnologia.
  domain: Odoo
  domain_scope: Odoo-only for V1
  target_version: Odoo 18
  runtime_principal: OpenCode
  runtime_direction: >
    Hybrid progressive operating model: OpenCode + commands + scripts/CLI/
    validators locales + storage simple y auditable. V1 is not agents-only
    and cannot be purely manual or narrative-only.
  source_runtime: DEC-ACCEPTED-136, DEC-ACCEPTED-137, DEC-ACCEPTED-138
  pilot: >
    Solicitudes internas / aprobaciones simples (internal requests /
    simple approvals). Confirmed by owner via DEC-ACCEPTED-162.
    Closed selection; Blueprint must not reopen it.
  v1_goal: >
    Demonstrate an end-to-end verifiable flow from owner idea to Odoo 18
    module technically ready for production.
  readiness_definition: >
    Functional, installable/loadable in Odoo, tested, documented, secure
    within scope, auditable, reviewable, and with sufficient evidence.
    Does not mean deployed to production server.
  autonomy_principle: >
    Complete autonomy within the Odoo development lifecycle, with human
    control reserved for critical decisions, not micro-management.
  planning_horizon: 2 months as scope constraint (CRIT-01)

problem:
  statement: >
    Permitir que un propietario individual opere con capacidades
    equivalentes a un equipo de ingenieria especializado para construir
    soluciones empresariales Odoo.
  source: DEC-ACCEPTED-014
  context: >
    The owner operates as a single-worker enterprise. CAFL should close
    the gap between a solo owner and a full engineering team for Odoo
    module development.

intended_user:
  description: >
    El usuario inicial de CAFL es el owner. V1 no esta definido para
    clientes, equipos externos o desarrolladores externos.
  source: DEC-ACCEPTED-015

roles:
  owner:
    role: "Human decision gate for critical matters"
    responsibilities:
      - "Define intent and respond to critical decisions"
      - "Approve scope changes, significant exceptions, significant debt"
      - "Approve deadline-driven scope reductions"
      - "Grant final module acceptance"
    limits:
      - "Does not micro-manage normal tasks"
      - "Does not replace QA, gates, or evidence"
    mechanism: "Exclusively human for critical decisions"
    approval_required_for:
      - "Scope change"
      - "Unresolvable critical context lack"
      - "Legal/compliance critical risk"
      - "Normative contradiction"
      - "High security/data risk"
      - "Irreversible architectural decision"
      - "Testing/DoD exception"
      - "Repeated rework beyond limit"
      - "Final module acceptance"
      - "Deadline-based scope reduction"
    sources:
      - DEC-ACCEPTED-019
      - DEC-ACCEPTED-059
      - TOM Roles Y Capacidades
  agents:
    role: "LLM-assisted reasoning and judgment"
    mechanism_description: >
      Agents are suitable for judgment, reasoning, analysis, design,
      generation, diagnosis, review, and drafting. They are NOT
      executable, not self-verifying, and not self-approving.
    responsibilities:
      - "Functional analysis (PRD drafting)"
      - "Odoo technical design (SDD drafting)"
      - "Backend construction"
      - "QA planning and diagnosis"
      - "Risk review and documentation drafting"
    limits:
      - "Cannot approve gates"
      - "Cannot self-close"
      - "Cannot convert narrative into authoritative state"
      - "Cannot replace deterministic evidence"
    sources:
      - DEC-ACCEPTED-055
      - DEC-ACCEPTED-056
      - DEC-ACCEPTED-062
      - DEC-ACCEPTED-063
      - TOM Roles Y Capacidades
  orchestration:
    role: "Flow coordination and gate decision for normal cases"
    mechanism: "Mixed (assisted + future deterministic control)"
    responsibilities:
      - "Coordinate flow, handoffs, conceptual state"
      - "Manage blocking, rework, escalation"
      - "Decide normal gates based on evidence"
    limits:
      - "Cannot convert LLM narrative into real state"
      - "Cannot decide critical decisions or final module closure"
    sources:
      - DEC-ACCEPTED-058
      - TOM Matriz Operativa De Capacidades
  deterministic_controls:
    role: "Verifiable, reproducible validation not dependent on LLM reasoning"
    mechanism: "Scripts/CLI/validators candidates, rules/config, skills/playbooks"
    expected_scope_v1:
      - "Structural validation of packets/contracts/gates/evidence"
      - "DoR structural checks"
      - "Minimum traceability"
      - "Logs/state/evidence recording"
      - "Odoo 18 install/update/test execution"
      - "Evidence capture"
      - "Source policy / Knowledge Gap basics"
    limits:
      - "Do not replace technical judgment, gate decision, or owner acceptance"
    sources:
      - DEC-ACCEPTED-069
      - DEC-ACCEPTED-140
      - DEC-ACCEPTED-145
      - TOM Automatico Asistido Y Exclusivamente Humano
  mechanism_split_summary:
    categories:
      - type: "Conceptual agents"
        responsibility: "Reasoning, analysis, design, generation, review"
        constraints: "Not executable, not self-closing, not self-approving"
      - type: "Command candidates"
        responsibility: "Repeatable inputs to structure phases/tasks"
        constraints: "Not real commands, not final gate authority"
      - type: "Script/CLI/validator candidates"
        responsibility: "Deterministic structural validation and evidence capture"
        constraints: "Not implemented; language and toolchain remain spike-dependent"
      - type: "Rules/config"
        responsibility: "Minimum invariants"
        constraints: "Conceptual only"
      - type: "Skills/playbooks"
        responsibility: "On-demand operational knowledge"
        constraints: "Conceptual only"
      - type: "Human/owner"
        responsibility: "Critical decisions and gate closure"
        constraints: "Exclusively human; no agent delegation"
    source_blueprint_section: S08

contracts:
  role: >
    Formal internal agreement between phases, responsibilities, mechanisms,
    or artifacts that defines inputs, outputs, context, token budget,
    evidence, producer, consumer, validator, sufficiency criteria, rejection
    criteria, and handoff.
  source: CRIT-04, DEC-ACCEPTED-072
  base_envelope_fields:
    - proposito
    - unidad_de_control
    - producer
    - consumer
    - validator
    - inputs
    - outputs
    - contexto
    - token_budget
    - restricciones
    - criterios_de_suficiencia
    - criterios_de_rechazo
    - evidencia
    - blockers
    - handoff
    - version
    - trazabilidad
  always_required_contracts:
    - "Base Contract Envelope"
    - "Idea -> PRD"
    - "PRD -> SDD"
    - "SDD -> Task/Context Packet"
    - "Task/Context Packet + DoR"
    - "Task Execution"
    - "QA/Testing"
    - "Evidence/Closure"
    - "Context Routing / Token Budget"
  conditional_required_contracts:
    - "Security/Risk/Compliance Review"
    - "Rework"
    - "Escalation/Owner Decision"
    - "Mechanism Execution Profile"
  source_contracts: DEC-ACCEPTED-074, DEC-ACCEPTED-075

gates:
  role: >
    Internal decision points that verify criteria and evidence to continue,
    block, rework, accept debt, or escalate.
  source: CRIT-05, DEC-ACCEPTED-090
  separation_principle: "Gate recommendation, gate verification, and gate decision are separated"
  decision_authority: "Orchestration decides normal gates based on evidence; owner decides critical decisions and final module closure"
  independent_gates:
    - "PRD Sufficiency Gate"
    - "SDD Sufficiency Gate"
    - "Task Packet / DoR Gate"
    - "QA/Testing Gate"
    - "Evidence/Closure Gate"
    - "Module Technical Readiness Gate"
  transversal_checks:
    - "Context Routing / Token Budget"
    - "Security/Risk/Compliance Triage"
  conditional_gates:
    - "Security/Data/Access Gate"
    - "Debt Acceptance Gate"
    - "Rework Limit Gate"
  severity_scale:
    - blocker
    - critical
    - high
    - medium
    - low
    - warning/info
  actions:
    - continue
    - continue_with_warning
    - rework
    - block
    - escalate_to_owner
    - reject/stop
    - accept_technical_debt
    - replan/reduce_scope
  rework_default_limit: 2 cycles per task under same scope
  sources:
    - DEC-ACCEPTED-091
    - DEC-ACCEPTED-092
    - DEC-ACCEPTED-093
    - DEC-ACCEPTED-094
    - DEC-ACCEPTED-095
    - DEC-ACCEPTED-096
    - DEC-ACCEPTED-104

evidence:
  role: >
    Documentary or technical proof that supports a decision, result,
    verification, or deliverable.
  principle: "Evidence must be reproducible; LLM narrative alone is not sufficient"
  minimum_v1_evidence:
    - "Traceable PRD and SDD"
    - "Contract/packet registry"
    - "Context/source usage logs"
    - "Gate logs with recommendation, verification, decision, severity, action, evidence"
    - "Evidence logs of changes, tests, install/update/test execution, results, documentation, closure"
    - "Rework history if applicable"
    - "Debt log with accepted debt or none declaration"
    - "Approval log for owner decisions, exceptions, and final acceptance"
  sources:
    - DEC-ACCEPTED-100
    - DEC-ACCEPTED-115
    - TOM Evidencia Minima Del Piloto

state:
  role: >
    Authoritative state lives in traceable, versionable, logical records.
    LLM narrative is not authoritative state.
  source: DEC-ACCEPTED-107
  required_logs_always:
    - "State/Status Change Log"
    - "Decision Log"
    - "Contract/Packet Registry"
    - "Gate Log"
    - "Evidence Log"
    - "Source Registry/Source Log"
    - "Context Log"
    - "Rework History"
    - "Approval Log"
  required_logs_conditional:
    - "Source Snapshot Log"
    - "Source Usage Log"
    - "Excluded/Prohibited Context Log"
    - "Token/Context Usage Log"
    - "Debt Log"
    - "Knowledge Registry Log"
    - "Integration Source Log"
  authority_hierarchy:
    L1: "project-truth/ — authoritative governed records"
    L2: "Governed registered evidence"
    L3: "Candidate evidence"
    L4: "Ephemeral"
  storage_direction: "Simple, auditable, Git-compatible (Markdown, JSON/YAML, JSONL append-only)"
  sources:
    - DEC-ACCEPTED-108
    - DEC-ACCEPTED-111
    - DEC-ACCEPTED-112
    - DEC-ACCEPTED-146


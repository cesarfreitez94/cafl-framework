knowledge_governance:
  mode: "Minimum mode by default in V1"
  minimum_source_policy:
    authorized:
      - "docs.odoo.com"
      - "github.com/odoo/odoo"
    expansion_path: "Curation Request -> owner gate -> approve/reject -> L1 registration"
    prohibited:
      - "Free web search as direct implementation source"
      - "Wikipedia as direct technical source"
      - "Unauthorized blogs"
      - "StackOverflow as authoritative source"
      - "Copying third-party solutions without validation"
  knowledge_gap: "Block implementation until authorized source/artifact/pack is sufficient"
  curation_mode: "Activated by Knowledge Gap; requires owner approval or prior source policy"
  deferred_from_v1:
    - "RAG / vector base"
    - "Broad automated documentation ingestion"
  sources:
    - DEC-ACCEPTED-163
    - DEC-ACCEPTED-126
    - DEC-ACCEPTED-127
    - DEC-ACCEPTED-128
    - DEC-ACCEPTED-148
    - DEC-ACCEPTED-150

operating_flow:
  control_unit: "module -> capability/feature -> task (verifiable)"
  phases:
    - id: 1
      name: "Idea intake"
      executor: "Owner + functional analysis + orchestration"
      validator: "Orchestration"
      output: "Traced intake, initial objective, questions, required context"
      blocks_if: "Ambiguous critical objective, impossible scope, context gap preventing elicitation"
      advance_condition: "Sufficient basis to elicit PRD without inventing"
    - id: 2
      name: "PRD light"
      executor: "Assisted functional analysis"
      validator: "Technical receptor/orchestration; owner if critical scope"
      output: "Light PRD with scope in/out, actors, rules, acceptance criteria, risks, blocking questions"
      blocks_if: "Missing scope, critical rule, acceptance, legal/compliance/security/data risk, or owner decision"
      advance_condition: "PRD Sufficiency Gate can verify"
    - id: 3
      name: "PRD Sufficiency Gate"
      executor: "Functional analysis recommendation"
      validator: "Orchestration/technical receptor; owner if critical decision"
      output: "Gate decision: continue, rework, block, or escalate"
      blocks_if: "PRD does not allow designing without inventing or contains critical blocker"
      advance_condition: "Gate decides continue"
    - id: 4
      name: "SDD light"
      executor: "Assisted Odoo technical design"
      validator: "QA/risk/technical receptor"
      output: "Light SDD, minimum ADR if applicable, technical strategy and tests, risks"
      blocks_if: "Insufficient Odoo source, critical technical ambiguity, security/data/compliance risk, irreversible architectural decision without owner"
      advance_condition: "SDD Sufficiency Gate can verify"
    - id: 5
      name: "SDD Sufficiency Gate"
      executor: "Architect recommendation"
      validator: "QA/risk/receptor; orchestration decides normal, owner if irreversible"
      output: "Gate decision: continue, rework, block, escalate, or replan"
      blocks_if: "Not implementable design, insufficient sources, critical risks, untestable plan"
      advance_condition: "Gate decides continue"
    - id: 6
      name: "Capabilities/tasks + task/context packets"
      executor: "Architect + orchestration + context routing"
      validator: "Receptor/validator of each packet"
      output: "Hierarchy module -> capability/feature -> task and candidate packets"
      blocks_if: "Unverifiable tasks, mixed scope, insufficient context, undeclared blockers"
      advance_condition: "Each task has a validatable packet"
    - id: 7
      name: "Task Packet / DoR Gate"
      executor: "Producer/orchestration recommendation"
      validator: "Receptor or validator; orchestration decides"
      output: "Packet ready or DoR rejection"
      blocks_if: "Missing minimum fields, consumer cannot execute without inventing, expected evidence not verifiable"
      advance_condition: "Gate decides continue and packet is ready"
    - id: 8
      name: "Task execution"
      executor: "Builder/executing capability"
      validator: "QA, architect, or applicable reviewer"
      output: "Expected technical/documentary change and execution report"
      blocks_if: "Scope creep, insufficient source, ambiguous permissions, Knowledge Gap, critical risk, or scope change"
      advance_condition: "Output meets packet and can be tested"
    - id: 9
      name: "QA/Testing Gate"
      executor: "QA + reproducible future execution/capture"
      validator: "Independent QA/orchestration; owner if critical exception"
      output: "QA result, failures, recommendations, rework or advance"
      blocks_if: "Minimum testing not executed, absent evidence, critical failure, builder self-closure"
      advance_condition: "Gate decides continue, or continue with warning allowed"
    - id: 10
      name: "Evidence/Closure Gate per task/capability"
      executor: "Evidence/closure + orchestration"
      validator: "QA/orchestration; owner conditional"
      output: "Operational closure package for task/capability"
      blocks_if: "DoD not demonstrated, minimum evidence/documentation absent, functional debt, open blocker"
      advance_condition: "Gate decides closure or non-blocking warning allowed"
    - id: 11
      name: "Controlled rework"
      executor: "Orchestration + QA/reviewer + executor"
      validator: "QA/reviewer and orchestration; owner on third significant cycle or scope change"
      output: "Correction, new evidence, rework log, or escalation"
      blocks_if: "Third significant cycle without owner, hidden scope change, undiagnosed cause"
      advance_condition: "Failure corrected within limit or owner decides exception/replan"
    - id: 12
      name: "Module Technical Readiness Gate"
      executor: "QA/orchestration/evidence closure recommendation"
      validator: "QA, security/risk/compliance, and owner"
      output: "Final technical production decision: ready, block, rework, reject/stop, or replan/reduce scope"
      blocks_if: "Minimum testing/evidence/documentation absent, functional debt, critical risk, installation/loading not validated"
      advance_condition: "Owner accepts final module as technically ready for production"
    - id: 13
      name: "Knowledge governance transversal"
      executor: "Knowledge governance/curation + owner/source policy if applicable"
      validator: "Source policy, steward, owner when no approved source exists"
      output: "Source usage, authorized artifact, or Knowledge Gap + Curation Request"
      blocks_if: "Insufficient authorized knowledge, prohibited source needed, insufficient source policy"
      advance_condition: "Sufficient authorized knowledge or owner/source policy approves curation"
  invariants:
    - "PRD and SDD are mandatory in light version"
    - "No operational unit starts without task/context packet and minimum DoR"
    - "Context routing and token budget are mandatory per contract and packet"
    - "Gate recommendation, verification, and decision are separated"
    - "Owner decides critical decisions and final module closure"
  sources:
    - CRIT-02
    - TOM Flujo Operativo Punta A Punta
    - DEC-ACCEPTED-036 through DEC-ACCEPTED-053


  - "CAFL decomposes the module into capabilities and verifiable tasks"
  - "Each task receives a task/context packet with DoR validated by the consumer"
  - "OpenCode coordinates agents to build backend, views, security, and data"
  - "QA/Testing Gate verifies outputs with reproducible evidence (not just LLM narrative)"
  - "Evidence/Closure Gate per task consolidates evidence, docs, and traceability"
  - "Module Technical Readiness Gate validates aggregated evidence, tests, and pilot execution"
  - "Owner reviews and accepts the module as technically ready for production"
  - "Knowledge governance runs transversally: source policy enforced, Knowledge Gaps blocked and curated, Curation Requests owner-gated"
  - "All state, decisions, evidence, gates, sources, rework, and approvals are logged in append-only, Git-compatible records"
  - "Rework is bounded to 2 cycles per task; third cycle escalates to owner"
  - "13 primary spikes (SP-01..SP-13) plus additional section-specific spike families resolve open uncertainties where applicable (permissions, commands/skills, Odoo 18 environment, secrets, toolchain) before committing to physical implementations"
  - "SDK/server, RAG/vector base, dashboard/UI, CI/CD, and broad integrations remain post-V1 pending future explicit owner decisions"

contract_id: cafl-backlog-candidate-generation-contract
version: 0.2.0
derived_from: project-truth/implementation-blueprint.md
blueprint_section: S18 Blueprint Outputs to Backlog
note: >
  This contract governs deterministic backlog candidate generation from the
  completed CAFL V1 Implementation Blueprint. It does NOT create detailed
  tasks, authorize implementation, reopen Blueprint content, or modify
  approved decisions. The contract is consumed by blueprint_to_backlog.py
  and validated by backlog_verify.py.

scope:
  purpose: >
    Generate traceable backlog candidates (Epics and Capabilities only)
    from the S18 category domains using deterministic inputs. Backlog
    candidates provide a bridge from the Blueprint to later planning
    without creating detailed tasks, sequencing, estimates, owners,
    acceptance tests, or deliverable artifacts.
  source_of_truth: project-truth/
  blueprint_path: project-truth/implementation-blueprint.md
  traceability_map_path: generated/blueprint/traceability-map.json
  blueprint_index_path: generated/blueprint/blueprint-index.json

generation_rules:
  rule_s18_categories_sole_source:
    description: >
      S18 categories are the only direct source of backlog domains.
      Each Epic maps to exactly one S18 category.
    enforcement: deterministic

  rule_s17_traceability_attach:
    description: >
      S17 traceability matrix and the generated traceability-map.json
      are used only to attach source references (upstream_refs) to
      each candidate. They do not create new categories.
    enforcement: deterministic

  rule_epics_and_capabilities_only:
    description: >
      Only Epics and Capabilities are generated. No detailed
      implementation tasks, user stories, tickets, execution steps,
      sequencing, estimates, or owners are generated.
    enforcement: deterministic

  rule_every_item_has_required_fields:
    description: >
      Every item (Epic or Capability) must include: id, type, title,
      source_category, source_sections, upstream_refs, rationale,
      boundary, acceptance_criteria, excluded_scope,
      owner_decision_required, readiness.
    enforcement: deterministic

  rule_v1_post_v1_boundary_preserved:
    description: >
      V1/Post-V1 and conditional boundaries from the Blueprint must
      be preserved. Items touching conditional, open-uncertainty, or
      post-V1-gated areas must be visibly separated with
      readiness: conditional or post-v1.
    enforcement: deterministic

  rule_spike_dependent_visible:
    description: >
      Items that depend on unresolved spikes (SP-04, SP-05) or
      post-V1-gated spikes (SP-11..SP-13) must be marked with
      appropriate readiness and spike dependency annotations.
    enforcement: deterministic

  rule_no_external_tooling:
    description: >
      No external project-management tooling is introduced or
      referenced. All outputs are YAML/Markdown within the
      repository.
    enforcement: deterministic

  rule_no_forbidden_verbs:
    description: >
      Backlog candidate titles and rationale must not use execution-
      oriented verbs: Implement, Provision, Enforce, Integrate,
      Scaffold, Resolve. Preferred verbs: Define, Specify, Describe,
      Bound, Classify, Track, Identify, Validate readiness for.
    enforcement: deterministic
    forbidden_verbs:
      - Implement
      - Provision
      - Enforce
      - Integrate
      - Scaffold
      - Resolve

item_schema:
  required_fields:
    - id
    - type
    - title
    - source_category
    - source_sections
    - upstream_refs
    - rationale
    - boundary
    - acceptance_criteria
    - excluded_scope
    - owner_decision_required
    - readiness

  allowed_types:
    - epic
    - capability

  allowed_readiness:
    - candidate
    - conditional
    - post-v1

  field_definitions:
    id:
      description: Unique stable identifier (EPIC-BACKLOG-NNN or CAP-BACKLOG-NNN).
      format: EPIC-BACKLOG-{seq:03d} or CAP-BACKLOG-{seq:03d}
    type:
      description: Item type, either epic or capability.
      values: [epic, capability]
    title:
      description: Short, descriptive title derived from the S18 category domain.
    source_category:
      description: The S18 category name from which this item is derived.
    source_sections:
      description: Blueprint section IDs referenced by the S18 category (e.g. S07, S11, S17).
    upstream_refs:
      description: >
        Traceability anchors from S17 and the traceability-map.json
        that support this item (e.g. TOM-04, SP-04, VAL-01, SCH-01,
        DEC-ACCEPTED-136, RISK-059).
    rationale:
      description: Why this item exists, derived from the S18 category scope.
    boundary:
      description: >
        Explicit boundaries of the item, preserving V1/Post-V1 limits,
        non-goals, and the item's specific constraints.
    acceptance_criteria:
      description: >
        High-level criteria the item must satisfy, derived from upstream
        acceptance criteria and category scope.
    excluded_scope:
      description: What this item explicitly excludes (non-goals, deferred, post-V1).
    owner_decision_required:
      description: >
        Whether the item requires owner decision before further elaboration.
        Values: none, yes, pending-spike-result.
      values: [none, yes, pending-spike-result]
    readiness:
      description: >
        Readiness state. candidate = ready for backlog planning.
        conditional = depends on unresolved spike or owner decision.
        post-v1 = deferred beyond V1 core.
      values: [candidate, conditional, post-v1]

outputs:
  generated_files:
    - backlog/backlog-candidates.yaml
    - backlog/backlog-traceability.yaml
  report_files:
    - reports/backlog/backlog-generation-report.md
  verification:
    - reports/backlog/backlog-verification-report.md

forbidden_actions:
  - modifying Blueprint content (implementation-blueprint.md)
  - modifying blueprint-state.yaml
  - modifying blueprints approvals or statuses
  - modifying historical reports under reports/blueprint/
  - creating runtime or executable artifacts
  - creating detailed implementation tasks
  - introducing external project-management tooling
  - expanding V1 scope beyond approved boundaries
  - reopening CRIT-01..CRIT-07, TOM, or accepted decisions


    - in-verification
    - needs-fix
    - pending-owner-approval
    - approved
    - closed
  iteration_gate_status: pending-owner-approval
  section_approval_status: approved
  note: >
    pending-owner-approval is an iteration-level gate status (RULE-01).
    approved is a section-level status after owner explicitly approves.
    Sections are approved individually; iterations are closed as a group
    only after owner gate approval.


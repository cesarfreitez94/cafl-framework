blueprint:
  path: project-truth/implementation-blueprint.md
  working_contract_path: project-truth/implementation-blueprint.md
  total_sections: 19
  total_iterations: 5
  current_iteration: 5
  owner_approval_required: true
  commit_policy: owner_only
  source_of_truth: project-truth/

statuses:
  allowed:
    - not-started
    - in-progress
    - in-verification
    - needs-fix
    - pending-owner-approval
    - approved
    - closed
  iteration_gate_status: pending-owner-approval
  section_approval_status: approved
  note: >
    pending-owner-approval is an iteration-level gate status (RULE-01).
    approved is a section-level status after owner explicitly approves.
    Sections are approved individually; iterations are closed as a group
    only after owner gate approval.

iterations:
  I1:
    name: "Marco arquitectonico base"
    sections: [S01, S02, S03, S04, S05, S06]
    status: closed
    owner_gate: approved
  I2:
    name: "Diseno operativo de mecanismos"
    sections: [S07, S08]
    status: closed
    owner_gate: approved
    depends_on: [I1]
  I3:
    name: "Artefactos tecnicos de control"
    sections: [S09, S10, S11, S12]
    status: closed
    owner_gate: approved
    depends_on: [I2]
  I4:
    name: "Ejecucion Odoo y piloto"
    sections: [S13, S14, S15]
    status: closed
    owner_gate: approved
    depends_on: [I3]
  I5:
    name: "Cierre del Blueprint"
    sections: [S16, S17, S18, S19]

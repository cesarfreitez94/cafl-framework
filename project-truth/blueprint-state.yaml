sections:
  S01:
    title: "Blueprint Scope and Non-Goals"
    iteration: I1
    status: closed
    owner_approval: approved
    iteration_position: 1
    depends_on: []
    fix_iterations: 0
    last_author_report: null
    last_fix_report: null
    last_verification_report: null
    open_issues: []
    context_summary: >
      Defines what the Blueprint is within CAFL V1 and what it must not cross.
      Fixed decisions: CRIT-01..07 approved and not reopened; TOM approved by
      DEC-ACCEPTED-161; project-truth/ remains source of truth; CAFL V1 is
      Odoo-only targeting Odoo 18; OpenCode is primary runtime; pilot V1 is
      internal requests / simple approvals (DEC-ACCEPTED-162); minimal source
      policy is official Odoo docs + github.com/odoo/odoo (DEC-ACCEPTED-163);
      SDK/server out of V1 core (DEC-ACCEPTED-164); RAG/vector base deferred to
      V2. Blueprint must not create runtime, executable agents, real commands,
      physical schemas, real validators, scripts, RAG, detailed backlog,
      final PRD or SDD. framework/ is excluded as input. Guardrails: every
      Blueprint component must be traceable to TOM, approved CRIT or accepted
      decision; conflicts must be registered, not resolved by agent criteria.

  S02:
    title: "Architecture Principles"
    iteration: I1
    status: closed
    owner_approval: approved
    iteration_position: 2
    depends_on: [S01]
    fix_iterations: 0
    last_author_report: reports/blueprint/S02-author-report.md
    last_fix_report: null
    last_verification_report: reports/blueprint/S02-verification-report.md
    open_issues: []
    context_summary: >
      Defines architecture principles AP-01..AP-12 for all later Blueprint
      sections. Invariants: single `project-truth/` authority and
      bidirectional traceability; OpenCode is primary runtime but not
      authoritative state, gate decision or evidence by itself; CAFL V1 uses a
      hybrid progressive model, not agents-only; LLM reasoning stays separated
      from verifiable deterministic control; progress is contract/gate/evidence
      driven with no self-closure; context routing and minimal source policy are
      mandatory; V1 remains Odoo-only on Odoo 18 and aligned to the confirmed
      internal requests / simple approvals pilot; V1 stays minimal with RAG/base
      vectorial, SDK/server core, dashboard/UI, CI/CD completo, DB avanzada,
      multiusuario/equipo, plugins/MCP, curation avanzada and broad post-V1
      capabilities deferred unless future explicit owner decision allows them;
      storage/logs/evidence should remain simple, auditable and Git-compatible;
      security/risk/compliance and secrets are cross-cutting criteria; uncertain
      physical/runtime choices require Blueprint/spikes; design remains
      greenfield from `project-truth/` with `framework/` excluded. S02 does not
      decide runtime layout, physical paths, final schemas/validators, commands,
      permissions, exact Odoo environment, definitive storage, executable
      secrets policy or final spike order.

  S03:
    title: "V1 / Post-V1 Boundary"
    iteration: I1
    status: closed
    owner_approval: approved
    iteration_position: 3
    depends_on: [S01, S02]
    fix_iterations: 0
    last_author_report: reports/blueprint/S03-author-report.md
    last_fix_report: null
    last_verification_report: reports/blueprint/S03-verification-report.md
    open_issues: []
    context_summary: >
      Defines the V1 / post-V1 boundary for later Blueprint sections. V1 core
      is limited to the traceable Odoo-only, Odoo 18, OpenCode-based hybrid
      operating model for the confirmed internal requests / simple approvals
      pilot, with minimum evidence/control automation, source policy / Knowledge
      Gap basics, `project-truth/` traceability, and simple auditable evidence /
      storage posture. Conditional/spike areas remain conceptual and not
      implementation approval: runtime layout and mechanism split, exact Odoo 18
      execution environment, UI/OWL/Playwright only if pilot-justified,
      permissions/commands/skills/secrets, and Knowledge Governance without
      RAG/vector base. Deferred/post-V1 boundaries preserve RAG/vector base,
      SDK/server core, broad ingestion, real external integrations, dashboard/UI
      productization, full CI/CD, advanced DB/storage, multiuser/team operation,
      plugins/MCP, advanced curation and broad post-V1 capabilities unless a
      future explicit owner decision changes scope. Anti-scope-creep controls:
      unsupported V1 capabilities must be eliminated, deferred, or registered as
      owner-decision required; no source policy expansion, RAG/vector, SDK/server
      core, pilot broadening, default external integrations, or `framework/`
      reintroduction is allowed by this section.

  S04:
    title: "Runtime Layout Candidate"
    iteration: I1
    status: closed
    owner_approval: approved
    iteration_position: 4
    depends_on: [S01, S02, S03]
    fix_iterations: 0
    last_author_report: reports/blueprint/S04-author-report.md
    last_fix_report: null
    last_verification_report: reports/blueprint/S04-verification-report.md
    open_issues: []
    context_summary: >
      Defines the conceptual runtime layout candidate for CAFL V1 without
      approving physical structure or implementation. Candidate zones are source
      of truth / decision record, OpenCode coordination, repeatable inputs /
      command candidates, deterministic control candidates, auditable state /
      logs / evidence, source policy / Knowledge Gap, Odoo 18 pilot integration,
      security / permissions / secrets, and spikes / technical validations.
      Invariants: `project-truth/` remains authority; OpenCode is runtime and
      coordination support, not authoritative state, final gate, final storage,
      final source policy or sufficient evidence by itself; V1 remains Odoo-only
      on Odoo 18 for internal requests / simple approvals. Deferred/post-V1 or
      future-owner-decision items remain RAG/vector base, SDK/server core, broad
      ingestion, broad integrations, productized dashboard/UI, full CI/CD,
      advanced storage/DB, MCP/plugins, multiuser/team operation and advanced
      curation. Handoffs to S05/S06+ are conceptual only; S04 does not create
      runtime, final paths, executable agents, real commands, physical schemas,
      real validators, scripts, backlog, PRD, SDD or implementation.

  S05:
    title: "Source-vs-Runtime Structure"
    iteration: I1
    status: closed
    owner_approval: approved
    iteration_position: 5
    depends_on: [S04]
    fix_iterations: 0
    last_author_report: reports/blueprint/S05-author-report.md
    last_fix_report: null
    last_verification_report: reports/blueprint/S05-verification-report.md
    open_issues: []
    context_summary: >
      Defines the conceptual source-vs-runtime separation for CAFL V1 using the
      S04 layout candidate without approving physical runtime structure.
      `project-truth/` remains the sole authority for decisions, approved state,
      owner approval, gates, source policy and traceability; runtime outputs from
      OpenCode, candidate commands/mechanisms, logs or reports are only
      assistance/candidate evidence until registered under approved governance.
      OpenCode remains runtime coordination support, not authoritative state,
      final gate, final storage, final source policy or sufficient evidence by
      itself. The separation preserves Odoo 18 and the internal requests / simple
      approvals pilot, keeps the minimal source policy to official Odoo docs and
      github.com/odoo/odoo, and treats source gaps, security/secrets and spikes
      as governed future work. S05 does not create runtime, final paths,
      executable agents, real commands, physical schemas, validators, scripts,
      RAG/vector base, SDK/server, backlog, PRD, SDD, Odoo environment, secrets
      or implementation; `framework/` remains excluded.

  S06:
    title: "Initial Spike Map"
    iteration: I1
    status: closed
    owner_approval: approved
    iteration_position: 6
    depends_on: [S01, S02, S03, S04, S05]
    fix_iterations: 1
    last_author_report: reports/blueprint/S06-author-report.md
    last_fix_report: reports/blueprint/S06-fix-report.md
    last_verification_report: reports/blueprint/S06-verification-report.md
    open_issues: []
    context_summary: >
      Defines the Initial Spike Map for CAFL V1, organizing 13 conceptual spikes
      (SP-01..SP-13) into 4 dependency bands: (A) scope/source/security
      guardrails, (B) OpenCode/Odoo 18 base capabilities, (C) control/evidence
      toolchain, and (D) conditional anti-scope-creep. Each spike traces to TOM
      anchors, accepted risks, and accepted decisions. Precedence chain A→B→C
      with D separated from core V1. This section does not execute spikes, close
      uncertainties, or authorize implementation. It serves as initial input for
      S16 final spike ordering.

  S07:
    title: "OpenCode Operating Design"
    iteration: I2
    status: closed
    owner_approval: approved
    iteration_position: 7
    depends_on: [S01, S02, S03, S04, S05, S06]
    fix_iterations: 0
    last_author_report: reports/blueprint/S07-author-report.md
    last_fix_report: null
    last_verification_report: reports/blueprint/S07-verification-report.md
    open_issues: []
    context_summary: >
      Defines the conceptual OpenCode operating design for CAFL V1 without
      creating OpenCode config, agents, commands, skills, plugins, permissions,
      scripts, validators, schemas, runtime or implementation. OpenCode is
      positioned as primary runtime and coordination hub within the hybrid
      progressive model: it coordinates handoffs, context routing, mechanism
      candidate invocation, evidence candidate preparation, and Odoo 18 pilot
      coordination. It must not decide approvals, close gates, change state,
      resolve conflicts by agent criteria, treat chat/output as sufficient
      evidence, expand V1 scope, or create artifacts. Hybrid mechanism
      relationships differentiate agents, command candidates, script/CLI/validator
      candidates, rules/config, skills/playbooks, and human/owner roles.
      Conceptual handoff flows connect source of truth, OpenCode coordination,
      deterministic control candidates, evidence/storage, source policy/Knowledge
      Gap, security/secrets, and Odoo 18 pilot. V1 boundaries preserved: Odoo-only,
      Odoo 18, confirmed pilot, minimality, greenfield, source policy minima, and
      framework/ exclusion. Traces to AP-02..AP-05, S04, S05, S06 SP-04/SP-05,
      BR-01/BR-02, and accepted decisions. Feeds S08 mechanism split and
      S09-S12/S13-S15/S16 conceptual expectations.

  S08:
    title: "Agents / Commands / Scripts / Validators Split"
    iteration: I2
    status: closed
    owner_approval: approved
    iteration_position: 8
    depends_on: [S07]
    fix_iterations: 1
    last_author_report: reports/blueprint/S08-author-report.md
    last_fix_report: reports/blueprint/S08-fix-report.md
    last_verification_report: reports/blueprint/S08-verification-report.md
    open_issues: []
    context_summary: >
      Defines the conceptual mechanism split for CAFL V1 across six categories:
      agents conceptuales (reasoning/analysis), command candidates (repeatable
      inputs), script/CLI/validator candidates (deterministic control), rules/
      config conceptuales (invariants), skills/playbooks conceptuales
      (procedural knowledge), and human/owner (decisions and gate closure).
      Each mechanism defines responsibility, assignment criteria, and
      constraints; none creates executable artifacts. OpenCode remains primary
      runtime and coordination hub but not authoritative state, gate, storage,
      source policy, or policy engine. Delivers handoff guidance to S09-S12
      (schemas/validators/storage/source policy), S13-S15 (Odoo 18 pilot/
      security/pilot module), and S16 (preserves SP-04 and SP-05 as open spike
      uncertainties). Traces to S07 operating design, AP-02..AP-05/AP-07/
      AP-10/AP-12, S04/S05/S06, S03 BR-01/BR-02, and accepted decisions
      DEC-ACCEPTED-056/068/069/136/137/138/140/162/163.

  S09:
    title: "Schemas V1 Minimum Set"
    iteration: I3
    status: approved
    owner_approval: approved
    iteration_position: 9
    depends_on: [S07, S08]
    fix_iterations: 2
    last_author_report: reports/blueprint/S09-author-report.md
    last_fix_report: reports/blueprint/S09-fix-report.md
    last_verification_report: reports/blueprint/S09-verification-report.md
    open_issues: []
    context_summary: >
      Defines the conceptual minimum schema set (SCH-01..SCH-10) for CAFL V1:
      SCH-01 Authority Source, SCH-02 Traceability Link, SCH-03 Work State,
      SCH-04 Gate and Approval, SCH-05 Evidence Record, SCH-06 Deterministic
      Control, SCH-07 Runtime Output / Candidate Evidence, SCH-08 Context
      Packet, SCH-09 Source Policy / Knowledge Gap, SCH-10 Odoo Pilot Artifact.
      All schemas are logical categories only; physical schemas, JSON Schema,
      YAML schema, DDL, tables, ORM models and final formats are excluded.
      Each schema traces to CRIT-06, CRIT-07, TOM handoff, AP-01/AP-04/AP-06/
      AP-09, BR-01, S04, S05, S07, S08, and accepted decisions. Schemas serve
      deterministic controls, evidence, traceability, source policy, and Odoo 18
      pilot without converting OpenCode, agents, commands or runtime outputs
      into authority. Cross-section handoffs defined to S10 (validators), S11
      (storage/evidence), S12 (source policy/Knowledge Gap), and S13-S15 (Odoo
      18 pilot environment). Fix iterations: 2 (acceptance-criteria status
      reference corrected). Verification passed with zero issues.


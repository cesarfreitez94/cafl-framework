    context_summary: >
      Defines conceptual storage design for state, logs and evidence in CAFL V1.
      Establishes a 4-level authority hierarchy: L1 project-truth/ authoritative,
      L2 governed registered evidence, L3 candidate evidence, L4 ephemeral.
      Defines conceptual storage types (YAML/JSON structured state, Markdown
      evidence documents, JSONL append-only logs, session candidate outputs, named
      evidence artifacts) all Git-compatible per AP-09 and DEC-ACCEPTED-146.
      Defines a 6-step evidence lifecycle: origin, capture, validation, eligibility
      evaluation, governed registration, authoritative reference. Defines log
      categories: state transitions, gate prerequisites, validator results,
      execution context. Integrates VAL-03..VAL-06 results as candidate evidence
      sources. Delivers handoffs to S12 (evidence lifecycle/execution context log),
      S13-S15 (authority levels/lifecycle for Odoo 18 pilot evidence), S16
      (validator results/alerts for spike ordering), S17 (L2 evidence model for
      traceability matrix), S18 (evidence categories for backlog outputs), S19
      (lifecycle/levels for acceptance criteria audit). Respects S05 source-vs-runtime
      separation, S07-S08 mechanism constraints, and all V1 boundaries. Fix
      iterations: 2 (mirror-sync only on second fix). Verification passed with
      zero content issues.

